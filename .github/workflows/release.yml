name: Release

# Publishes to npm and creates the GitHub release when a v*.*.* tag is pushed.
#
# Authentication is npm Trusted Publishing (OIDC) — there is no NPM_TOKEN
# secret. One-time setup on npmjs.com:
#   npmjs.com/package/ai-prompting -> Settings -> Trusted Publisher
#     Publisher:          GitHub Actions
#     Organization/user:  reasance
#     Repository:         ai-prompting
#     Workflow filename:  release.yml     (exact, case-sensitive, with .yml)
#     Environment:        (leave empty)
# Then harden: Settings -> Publishing access -> "Require two-factor
# authentication and disallow tokens". Trusted publishing keeps working, and a
# leaked classic/automation token stops being able to publish.
#
# Why this replaced the NPM_TOKEN secret: the token silently expired and v0.3.0
# failed with `E404 PUT /ai-prompting` — npm answers 404 rather than 401 on a
# bad credential — which forced a manual publish and cost that release its
# provenance attestation, exactly as v0.1.6 had before it. OIDC has nothing to
# expire.
#
# ci.yml runs on branch pushes and PRs only, so a tag push is otherwise
# ungated: this workflow re-runs the full gate itself.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Gate, publish to npm, create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to prove the tag is on main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure npm meets the trusted-publishing floor
        # Pinned, not `npm@latest`: this job holds id-token: write, so an
        # unpinned global install would run arbitrary third-party code with
        # npm-publish rights. Node 24 usually already clears the floor, in
        # which case nothing is installed.
        env:
          NPM_FLOOR: 11.5.1
        run: |
          set -euo pipefail
          current="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$NPM_FLOOR" "$current" | sort -V | head -1)" = "$NPM_FLOOR" ]; then
            echo "npm $current satisfies the >= $NPM_FLOOR floor."
          else
            echo "npm $current is below $NPM_FLOOR — installing npm@$NPM_FLOOR."
            npm install -g "npm@${NPM_FLOOR}"
          fi

      - name: Install
        run: npm ci

      - name: Resolve and verify the version
        id: version
        # The tag reaches bash through the environment, never through ${{ }}
        # interpolation: git accepts backticks and $(...) in a tag name, and
        # this job can mint an npm publish token.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"

          if ! printf '%s' "$pkg_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$pkg_version' is not semver X.Y.Z"
            exit 1
          fi
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg_version"
            exit 1
          fi
          # npm forbids republishing a version to correct it, so a missing
          # changelog entry is caught before the irreversible step, not after.
          if ! grep -qF "## [${pkg_version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${pkg_version}]' entry"
            exit 1
          fi
          {
            echo "version=${pkg_version}"
            echo "tag=v${pkg_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — refusing to publish"
            exit 1
          fi

      - name: Gate (build + tests + doctor)
        run: npm test && npm run doctor

      - name: Inspect the tarball
        # The published artifact is what users get, and it is not the same set
        # of files as the repo. v0.3.0 nearly shipped `dist/tests/` because
        # `files` whitelisted all of `dist/`.
        run: |
          set -euo pipefail
          npm pack --dry-run
          if npm pack --dry-run 2>&1 | grep -q 'dist/tests/'; then
            echo "::error::compiled tests are in the tarball — narrow the \"files\" whitelist"
            exit 1
          fi

      - name: Publish to npm
        # Idempotent: a re-run after a partial failure is a no-op instead of a
        # red X. Trusted publishing attaches provenance automatically.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "ai-prompting@${VERSION}" version >/dev/null 2>&1; then
            echo "ai-prompting@${VERSION} is already on npm — skipping publish."
            exit 0
          fi
          npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it untouched."
            exit 0
          fi
          # Notes are the CHANGELOG section for this version, extracted between
          # its heading and the next one.
          notes="$(awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)"
          printf '%s\n' "$notes" > /tmp/release-notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/release-notes.md
