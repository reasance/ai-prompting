# Codex / ChatGPT skill UI metadata (optional).
#
# Codex reads this file from the installed skill directory
# (~/.agents/skills/ai-prompting/agents/openai.yaml) for how the skill appears
# in its UI. Schema: https://learn.chatgpt.com/docs/build-skills
#
# Name, description and trigger phrases live in SKILL.md, which every host
# reads. There is deliberately no version here: it drifted from package.json
# once (0.1.0 vs 0.3.2) and nothing reads it.

interface:
  display_name: ai-prompting
  short_description: Improve, score and compress prompts for any LLM agent
  default_prompt: "Improve this prompt: "

policy:
  allow_implicit_invocation: true
